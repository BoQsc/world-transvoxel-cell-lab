name: Terrain Lab Qualification

"on":
  push:
    paths:
      - ".github/workflows/terrain-lab-validation.yml"
      - ".gitattributes"
      - "project.godot"
      - "addons/world_transvoxel/**"
      - "addons/world_transvoxel_terrain_lab/**"
      - "docs/terrain_lab/**"
      - "labs/terrain_lab/**"
      - "shared/tools/**"
  pull_request:
    paths:
      - ".github/workflows/terrain-lab-validation.yml"
      - ".gitattributes"
      - "project.godot"
      - "addons/world_transvoxel/**"
      - "addons/world_transvoxel_terrain_lab/**"
      - "docs/terrain_lab/**"
      - "labs/terrain_lab/**"
      - "shared/tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_boundary:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify program status representations agree
        run: |
          python labs/terrain_lab/tools/sync_program_statuses.py
          git diff --exit-code -- addons/world_transvoxel_terrain_lab/standards/program_manifest.json docs/terrain_lab/TERRAIN_QUALIFICATION_PROGRAM.md

      - name: Verify dependency-ordered execution plan
        run: python labs/terrain_lab/tools/validate_execution_plan.py

      - name: Verify lab dependency boundaries
        run: python labs/cell_lab/tools/verify_lab_boundaries.py

      - name: Install pinned Godot
        run: python shared/tools/ci_install_godot.py

      - name: Verify both addon plugins load
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --editor --quit --path .

      - name: Run native temporal integrity wave
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --path . --script labs/terrain_lab/tools/run_temporal_wave_validation.gd

      - name: Run Terrain Lab boundary smoke
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --path . --script addons/world_transvoxel_terrain_lab/tests/wt_terrain_lab_smoke.gd

      - name: Run Terrain Qualification Program validation
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --path . --script labs/terrain_lab/tools/run_terrain_lab_validation.gd
