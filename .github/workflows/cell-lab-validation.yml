name: Cell Lab Validation

"on":
  push:
    paths:
      - ".github/workflows/cell-lab-validation.yml"
      - ".gitattributes"
      - "project.godot"
      - "addons/world_transvoxel/**"
      - "addons/world_transvoxel_cell_lab/**"
      - "docs/cell_lab/**"
      - "labs/cell_lab/**"
      - "shared/tools/**"
  pull_request:
    paths:
      - ".github/workflows/cell-lab-validation.yml"
      - ".gitattributes"
      - "project.godot"
      - "addons/world_transvoxel/**"
      - "addons/world_transvoxel_cell_lab/**"
      - "docs/cell_lab/**"
      - "labs/cell_lab/**"
      - "shared/tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_gl_compatibility_full:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify pinned native dependency provenance
        run: python labs/cell_lab/tools/verify_native_dependency.py --clone-source .ci/world-transvoxel-source

      - name: Install pinned Godot
        run: python shared/tools/ci_install_godot.py

      - name: Verify project and native extension load
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --editor --quit --path .

      - name: Run structural smoke test
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --path . --script addons/world_transvoxel_cell_lab/tests/wt_cell_lab_smoke.gd

      - name: Run authoritative standards suite
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method gl_compatibility --path . --script labs/cell_lab/tools/run_cell_lab_validation.gd -- all

      - name: Capture and compare fresh Forward+ visuals
        run: python labs/cell_lab/tools/run_visual_validation.py --godot Godot_v4.7.1-stable_win64.exe --candidate-dir .godot/ci_visual_candidate --capture-log .godot/ci_visual_capture.log --report .godot/ci_visual_diff.json

      - name: Upload visual validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cell-lab-forward-plus-visual-evidence
          if-no-files-found: warn
          path: |
            .godot/ci_visual_candidate/*.png
            .godot/ci_visual_capture.log
            .godot/ci_visual_diff.json

  windows_mobile_smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify pinned native dependency provenance
        run: python labs/cell_lab/tools/verify_native_dependency.py --clone-source .ci/world-transvoxel-source

      - name: Install pinned Godot
        run: python shared/tools/ci_install_godot.py

      - name: Run mobile renderer smoke
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method mobile --path . --script addons/world_transvoxel_cell_lab/tests/wt_cell_lab_smoke.gd

  windows_forward_plus_smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify pinned native dependency provenance
        run: python labs/cell_lab/tools/verify_native_dependency.py --clone-source .ci/world-transvoxel-source

      - name: Install pinned Godot
        run: python shared/tools/ci_install_godot.py

      - name: Run forward-plus renderer smoke
        run: Godot_v4.7.1-stable_win64.exe --headless --rendering-method forward_plus --path . --script addons/world_transvoxel_cell_lab/tests/wt_cell_lab_smoke.gd
